<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LIBPULSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column on phones, two to three card columns on wider screens; black surfaces with hairline borders; colour is reserved for crowd status */
:root{
  --bg:#000;--s1:#0b0c0f;--s2:#12141a;--s3:#1a1d24;--line:#22252d;--line2:#323641;
  --fg:#f4f5f7;--fg2:#c0c5cf;--mute:#8d93a0;--accent:#8fb2ff;--accent-bg:#101a30;
  --low:#34d399;--low-bg:#052a1d;--mod:#fbbf24;--mod-bg:#2d2205;
  --high:#ff6f5e;--high-bg:#331009;--near:#e5334b;--near-bg:#3a0a12;--near-fg:#ff94a2;
  --font:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font:400 15px/1.5 var(--font);padding-inline:16px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;letter-spacing:-.01em}
.shell{max-width:1040px;margin:0 auto}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}
.l0{--c:var(--low);--cb:var(--low-bg)}
.l1{--c:var(--mod);--cb:var(--mod-bg)}
.l2{--c:var(--high);--cb:var(--high-bg)}
.l3{--c:var(--near);--cb:var(--near-bg);--cf:var(--near-fg)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;line-height:1;letter-spacing:.02em;color:var(--cf,var(--c));background:var(--cb);border:1px solid var(--line2);border-color:color-mix(in srgb,var(--c) 45%,transparent);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.tag{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;font:500 11px/1.2 var(--mono);letter-spacing:.04em;text-transform:uppercase;background:var(--s3);color:var(--fg2);border:1px solid var(--line)}
.tag.sim{color:var(--mod);background:var(--mod-bg);border-color:#4a3a0a}
.tag.pred{color:var(--accent);background:var(--accent-bg);border-color:#22335a}
.tag.live{color:var(--low);background:var(--low-bg);border-color:#0d4a33}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(0,0,0,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand b{display:block;font-size:15px;letter-spacing:.14em;font-weight:700}
.brand small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--s2);font:600 11px/1 var(--font);letter-spacing:.1em;cursor:pointer;flex:none}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--mod)}
.badge.live{color:var(--low)}.badge.live i{background:var(--low);animation:pulse 1.8s infinite}
.badge.demo{color:var(--mod)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}100%{box-shadow:0 0 0 8px rgba(52,211,153,0)}}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:10px 14px;border-radius:12px;font-size:13px;border:1px solid var(--line2);background:var(--s2);color:var(--fg2)}
.banner.demo{color:#ffd9a0;border-color:#5a3a12;background:repeating-linear-gradient(135deg,#2a1a05 0 14px,#2a0a0a 14px 28px)}
.banner.err{color:var(--near-fg);border-color:#5a1420;background:var(--near-bg)}
.banner button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:6px;min-height:36px}
main{padding-block:16px 120px;outline:none}
.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.card{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.card h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:12px}
.page-h{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.page-h h1{font-size:24px;font-weight:650}
.page-h p{color:var(--mute);font-size:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
@media(min-width:760px){
  .cols2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .home{grid-template-columns:minmax(0,420px) minmax(0,1fr);align-items:start}
  .span2{grid-column:1/-1}
}
/* ring */
.hero{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.ring-wrap{position:relative;width:min(260px,72vw);aspect-ratio:1}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring-t{fill:none;stroke:var(--s3);stroke-width:14}
.ring-p{fill:none;stroke:var(--c,var(--mute));stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1),stroke .4s;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--c,#000) 40%,transparent))}
.ring-g{stroke:var(--bg);stroke-width:3}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.rp{font:600 clamp(38px,12vw,52px)/1 var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.rp span{font-size:.45em;color:var(--mute);margin-left:2px}
.rs{color:var(--fg2);font-size:14px}
.rl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.guide{font-size:15px;color:var(--fg2)}
.upd{font:400 12px var(--mono);color:var(--mute)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:14px;border:1px solid var(--line2);background:var(--s2);font-weight:600;font-size:15px;cursor:pointer;transition:background .15s,transform .1s}
.btn:hover{background:var(--s3)}.btn:active{transform:scale(.98)}
.btn.primary{background:var(--fg);color:#000;border-color:var(--fg)}
.btn.primary:hover{background:#fff}
.btn.big{min-height:56px;width:100%;letter-spacing:.08em;text-transform:uppercase;font-size:14px}
.btn.sm{min-height:40px;padding:0 14px;font-size:13px;border-radius:12px}
.btn.danger{color:var(--near-fg);border-color:#5a1420}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-height:76px;padding:12px 14px;border-radius:14px;background:var(--s2);border:1px solid var(--line);text-align:left;cursor:pointer;min-width:0}
.tile:hover{border-color:var(--line2)}
.tl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.tv{font:600 20px/1.2 var(--font);font-variant-numeric:tabular-nums}
.tv.sm{font-size:15px}
/* forms */
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--fg2)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line2);color:var(--fg)}
textarea{min-height:90px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--mute)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--s2);color:var(--fg2);cursor:pointer;font-weight:500;font-size:14px}
.seg button[aria-pressed=true]{background:var(--fg);color:#000;border-color:var(--fg);font-weight:600}
.err-t{color:var(--near-fg);font-size:13px}
.ok-t{color:var(--low);font-size:13px}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:500;background:var(--s2)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
/* chart */
.chart{display:block;width:100%;height:auto}
.chart .gl{stroke:var(--line2);stroke-dasharray:3 4;stroke-width:1}
.chart .ax{stroke:var(--line2);stroke-width:1}
.chart .tx{fill:var(--mute);font:10px var(--mono)}
.chart .obs{fill:none;stroke:var(--fg);stroke-width:2.2;stroke-linejoin:round}
.chart .obs-a{fill:var(--fg);opacity:.08}
.chart .prd{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-dasharray:6 5;stroke-linejoin:round}
.chart .band{fill:var(--accent);opacity:.14}
.chart .ghost{fill:none;stroke:var(--mute);stroke-width:1.5;stroke-dasharray:2 4}
.chart .now{stroke:var(--mod);stroke-width:1;stroke-dasharray:2 3}
.chart .sel{stroke:var(--accent);stroke-width:1}
.chart .hit{fill:transparent;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--fg2)}
.legend i{display:inline-block;width:18px;height:0;border-top:2px solid var(--fg);vertical-align:middle;margin-right:6px}
.legend i.p{border-top:2px dashed var(--accent)}
.legend i.g{border-top:2px dotted var(--mute)}
.legend i.n{border-top:1px dashed var(--mod)}
.bars{display:flex;align-items:flex-end;gap:4px;height:120px}
.bars>div{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.bars b{width:100%;border-radius:5px 5px 2px 2px;background:var(--c,var(--mute));min-height:2px;opacity:.9}
.bars span{font:10px var(--mono);color:var(--mute);white-space:nowrap}
/* cards inside lists */
.rec{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px;background:var(--s2);border:1px solid var(--line)}
.rec .big{font:600 22px/1.2 var(--font);letter-spacing:-.01em}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:var(--s2);border:1px solid var(--line)}
.item p{font-size:14px;color:var(--fg2)}
/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--s1);color:var(--fg2);cursor:pointer;font-size:13px;font-weight:500}
.tabs button[aria-pressed=true]{background:var(--fg);color:#000;border-color:var(--fg);font-weight:600}
/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:min(560px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(8,9,11,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;border:0;border-radius:14px;background:none;color:var(--mute);font-size:11px;font-weight:500;cursor:pointer}
.nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current=page]{background:var(--s3);color:var(--fg)}
/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.66);animation:fade .2s}
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:41;width:min(640px,100%);max-height:88%;overflow-y:auto;background:var(--s1);border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 14px}
.sheet-h h2{font-size:18px;font-weight:650}
.x{width:44px;height:44px;border-radius:50%;border:1px solid var(--line2);background:var(--s2);font-size:20px;cursor:pointer;line-height:1}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto}
@keyframes up{from{transform:translate(-50%,40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.verdict{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:16px;background:var(--cb);color:var(--cf,var(--c));border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.verdict b{font-size:12px;letter-spacing:.14em}
.verdict span{font:650 22px/1.2 var(--font)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(90vw,460px);padding:12px 18px;border-radius:14px;background:var(--fg);color:#000;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
/* auth */
.auth{display:grid;gap:16px;padding-block:28px;min-height:100%;align-content:center}
.auth .brandp{display:flex;flex-direction:column;gap:14px}
.auth .brandp h1{font-size:clamp(34px,8vw,52px);font-weight:700;letter-spacing:.08em;line-height:1}
.auth .brandp .tagl{font-size:18px;color:var(--fg2)}
.auth ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;color:var(--mute);font-size:14px}
.auth li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--fg);margin-right:10px;vertical-align:middle}
@media(min-width:820px){.auth{grid-template-columns:1fr 420px;gap:48px;align-items:center}}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:8px 0;min-height:40px;text-align:left;font-size:14px}
.sp{height:1px;background:var(--line);margin:4px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* photos */
.photo{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background-size:cover;background-position:center;min-height:132px;display:flex;align-items:flex-end}
.photo::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.12) 0%,rgba(0,0,0,.84) 100%)}
.photo>div{position:relative;padding:16px;display:flex;flex-direction:column;gap:2px}
.photo b{font-size:18px;font-weight:650}
.photo span{font-size:13px;color:var(--fg2)}
@media(min-width:760px){.photo{min-height:176px}}
.pbg{position:relative;padding:24px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background-size:cover;background-position:center}
.pbg::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(0,0,0,.5),rgba(0,0,0,.9))}
.pbg>*{position:relative}

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const DAY=864e5,HR=36e5;
const LV=['Low','Moderate','High','Near Capacity'];
const GUIDE=['Low — plenty of seats available','Moderate — many seats available','High — seats are limited','Near capacity — expect a wait for a seat'];
const DEF={capacity:1200,dedupeSec:10,lowMax:50,modMax:75,highMax:90,trendPct:5,minDays:7,minEvents:150,open:8,close:20};
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){S.memOnly=true;return false}}
};
function hash(s){let h=5381;s=String(s);for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return(h>>>0).toString(16).padStart(8,'0')}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const S={user:null,view:'home',events:[],hist:[],noHist:false,snap:null,model:null,paused:false,err:null,auto:null,memOnly:false,evId:0,
  settings:Object.assign({},DEF,store.get('lp_settings',{})),
  ui:{sheet:null,fcSel:null,fcView:'chart',fcDur:2,plan:null,insCls:'wd',range:7,selDay:null,tab:'overview',auth:'login',resetStep:0,resetEmail:'',authErr:'',upload:null,exportText:'',cw:340,surgeN:100,errOff:false,planForm:null}};

/* time helpers */
const dayStart=ms=>{const d=new Date(ms);d.setHours(0,0,0,0);return d.getTime()};
const dayKey=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const hoursNow=()=>{const d=new Date();return d.getHours()+d.getMinutes()/60+d.getSeconds()/3600};
const hoursOf=ms=>{const d=new Date(ms);return d.getHours()+d.getMinutes()/60};
const cls=ms=>{const w=new Date(ms).getDay();return(w===0||w===6)?'we':'wd'};
function fmtH(h){const tm=Math.round(h*60),hh=Math.floor(tm/60)%24,mm=tm%60;return((hh%12)||12)+':'+String(mm).padStart(2,'0')+' '+(hh>=12?'PM':'AM')}
const fmtR=(a,b)=>fmtH(a)+' – '+fmtH(b);
const fmtTime=ms=>new Date(ms).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',second:'2-digit'});
const fmtDate=ms=>new Date(ms).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});
const fmtDur=h=>h<1?Math.round(h*60)+'m':(h%1?Math.floor(h)+'h '+Math.round((h%1)*60)+'m':h+'h');
const pc=v=>Math.round(v*100);
const rangeTxt=(lo,hi)=>{const a=pc(lo),b=pc(hi);return a===b?a+'%':a+'–'+b+'%'};

function profile(h,we){
  const g=(x,m,s)=>Math.exp(-.5*((x-m)/s)**2);
  let v=.10+.42*g(h,11.2,1.7)+.60*g(h,16.8,1.6)+.20*g(h,14.2,1.3);
  v*=clamp((h-7.7)/1.2,0,1)*clamp((20.4-h)/1.4,0,1);
  return we?v*.58:v;
}
function buildHist(){
  if(S.noHist)return [];
  const now=Date.now(),cap=S.settings.capacity,out=[];
  for(let d=1;d<=14;d++){
    const date=dayStart(now)-d*DAY,we=cls(date)==='we',r=rng(9100+d*37);
    const m=we?.9+.2*r():.95+.17*r();
    const occ=Array.from({length:24},(_,h)=>clamp(profile(h,we)*m*(1+(r()-.5)*.06),0,.98));
    let en=0,ex=0;
    for(let h=0;h<24;h++){const net=(occ[(h+1)%24]-occ[h])*cap,turn=occ[h]*cap*.28;en+=Math.max(0,net)+turn;ex+=Math.max(0,-net)+turn}
    out.push({key:dayKey(date),date,occ,entries:Math.round(en),exits:Math.round(ex),sim:true,live:false});
  }
  return out;
}
function mkEvent(type,src,origin,ts,token){return{id:++S.evId,ts,type,src,origin,token}}
function seedToday(){
  const now=Date.now(),cap=S.settings.capacity,st=S.settings,r=rng(20261008+Math.floor(now/DAY));
  const d0=dayStart(now),start=d0+st.open*HR,we=cls(now)==='we',evs=[],step=5*60e3;
  let cur=0,n=0,inside=[];
  const tok=()=>'u_'+hash('s'+(n++)+Math.floor(r()*1e9));
  for(let t=start;t<now;t+=step){
    const t2=Math.min(now,t+step);
    const target=Math.round(cap*clamp(profile(hoursOf(t2),we)*(.97+.06*r()),0,.97));
    const f=profile(hoursOf(t),we);
    const turn=Math.round(cap*.012*(.5+f*2)*(.6+.8*r()));
    const net=target-cur;
    let ex=Math.min(turn+Math.max(0,-net),inside.length),en=net+ex;
    if(en<0){en=0;ex=Math.min(-net,inside.length)}
    const at=()=>t+Math.floor(r()*(t2-t));
    const fresh=[];
    for(let i=0;i<en;i++){const tk=tok(),ts=at();fresh.push(tk);evs.push(mkEvent('ENTRY','SIMULATED','seed',ts,tk));if(r()<.004)evs.push(mkEvent('ENTRY','SIMULATED','seed',ts+2000+Math.floor(r()*4000),tk))}
    for(let i=0;i<ex;i++){const k=Math.floor(r()*inside.length),tk=inside.splice(k,1)[0],ts=at();evs.push(mkEvent('EXIT','SIMULATED','seed',ts,tk));if(r()<.004)evs.push(mkEvent('EXIT','SIMULATED','seed',ts+2000+Math.floor(r()*3000),tk))}
    inside=inside.concat(fresh);cur+=en-ex;
  }
  return evs;
}

/* event pipeline: validate, dedupe, clamp, aggregate */
function compute(){
  const st=S.settings,cap=st.capacity,win=st.dedupeSec*1000,now=Date.now(),tKey=dayKey(now);
  const q={dups:0,negClamp:0,overCap:0,ooo:0,missing:[],alerts:[]};
  let mx=-1;
  const due=S.events.filter(e=>e.ts<=now+2000);
  S.events.forEach(e=>{e._dup=false});
  due.forEach(e=>{if(e.ts<mx-60000)q.ooo++;if(e.ts>mx)mx=e.ts});
  const evs=due.slice().sort((a,b)=>a.ts-b.ts);
  const days={};let cur=null,occ=0,last=new Map(),inside=new Set(),prevLv=0;const vt=[];
  const finish=()=>{
    if(!cur)return;
    const isT=cur.key===tKey,nh=new Date(now).getHours();
    for(let i=0;i<24;i++)if(cur.hourOcc[i]==null){cur.hourOcc[i]=isT?(i>nh?null:occ):(i>=st.close?0:occ)}
    cur.endOcc=occ;cur.insideSet=inside;
    if(!isT&&occ>0)q.missing.push({key:cur.key,count:occ});
    if(isT&&hoursNow()>st.close+.5&&occ>0)q.missing.push({key:cur.key,count:occ});
    days[cur.key]=cur;
  };
  for(const e of evs){
    const k=dayKey(e.ts);
    if(!cur||cur.key!==k){
      finish();
      cur={key:k,date:dayStart(e.ts),hourOcc:Array(24).fill(null),entries:0,exits:0,dups:0,sim:false,live:false,hEn:Array(24).fill(0),hEx:Array(24).fill(0)};
      occ=0;last=new Map();inside=new Set();prevLv=0;
    }
    const h=new Date(e.ts).getHours();
    for(let i=0;i<=h;i++)if(cur.hourOcc[i]==null)cur.hourOcc[i]=occ;
    if(e.src==='SIMULATED')cur.sim=true;else cur.live=true;
    const key=e.token+'|'+e.type,lt=last.get(key);
    if(lt!=null&&e.ts-lt<=win&&e.ts>=lt){q.dups++;cur.dups++;e._dup=true;continue}
    last.set(key,e.ts);
    if(e.type==='ENTRY'){
      if(occ>=cap){occ=cap;q.overCap++;q.alerts.push({ts:e.ts,over:true,lv:3,pct:1});continue}
      occ++;cur.entries++;cur.hEn[h]++;inside.add(e.token);
    }else{
      if(occ<=0){q.negClamp++;continue}
      occ--;cur.exits++;cur.hEx[h]++;inside.delete(e.token);
    }
    const lv=level(occ/cap);
    if(lv>prevLv&&lv>=2)q.alerts.push({ts:e.ts,lv,pct:occ/cap});
    prevLv=lv;
    if(k===tKey)vt.push({ts:e.ts,type:e.type});
  }
  finish();
  const T=days[tKey]||null,occN=T?T.endOcc:0;
  const w=i=>{let en=0,ex=0;for(const v of vt){const a=now-v.ts;if(a>=i*HR&&a<(i+1)*HR){v.type==='ENTRY'?en++:ex++}}return{en,ex,net:en-ex}};
  const w0=w(0),w1=w(1),w2=w(2),thr=cap*st.trendPct/100;
  const noData=!T||(T.entries+T.exits)===0;
  const hasSim=S.events.some(e=>e.src==='SIMULATED'),hasLive=S.events.some(e=>e.src==='LIVE');
  return{now,cap,occ:occN,pct:noData?0:occN/cap,noData,entries1:w0.en,exits1:w0.ex,
    trend:w0.net>thr?'Increasing':w0.net<-thr?'Decreasing':'Stable',trendThr:Math.round(thr),
    rate:(w0.net+w1.net+w2.net)/3/cap,recent3:vt.filter(v=>now-v.ts<3*HR).length,
    lastTs:evs.length?evs[evs.length-1].ts:null,q,days,T,tKey,
    hourObs:T?T.hourOcc.map(v=>v==null?null:v/cap):[],
    future:S.events.length-due.length,mode:S.events.length?'LIVE':'NONE',hasSim,hasLive};
}
function buildModel(sn){
  const cap=S.settings.capacity,by=new Map();
  S.hist.forEach(d=>by.set(d.key,d));
  Object.values(sn.days).forEach(d=>{
    if(d.key!==sn.tKey&&d.entries+d.exits>0)by.set(d.key,{key:d.key,date:d.date,occ:d.hourOcc.map(v=>(v==null?0:v)/cap),entries:d.entries,exits:d.exits,sim:d.sim,live:d.live});
  });
  const all=[...by.values()].sort((a,b)=>b.date-a.date);
  const mk=()=>({n:0,mean:Array(24).fill(0),sd:Array(24).fill(0)}),m={wd:mk(),we:mk()};
  all.forEach(d=>{const c=m[cls(d.date)];c.n++;d.occ.forEach((v,h)=>c.mean[h]+=v)});
  ['wd','we'].forEach(k=>{const c=m[k];if(c.n)c.mean=c.mean.map(v=>v/c.n)});
  all.forEach(d=>{const c=m[cls(d.date)];d.occ.forEach((v,h)=>c.sd[h]+=(v-c.mean[h])**2)});
  ['wd','we'].forEach(k=>{const c=m[k];if(c.n)c.sd=c.sd.map(v=>Math.sqrt(v/c.n))});
  return{days:all,m};
}

/* forecasting: historical hourly baseline + damped recent-rate adjustment */
function histAt(M,t,key){if(!M.n)return 0;t=((t%24)+24)%24;const a=Math.floor(t),f=t-a,arr=M[key||'mean'];return arr[a]+(arr[(a+1)%24]-arr[a])*f}
function conf(){
  const sn=S.snap,st=S.settings,n=S.model.m[cls(Date.now())].n,rec=sn.recent3;
  let c=(n>=st.minDays||rec>=st.minEvents)?2:(n>=Math.ceil(st.minDays/2)||rec>=st.minEvents/2)?1:0;
  if(sn.mode==='DEMO'&&c>1)c=1;
  if(sn.noData)c=0;
  return c;
}
const CONF=['Low','Medium','High'];
function predictAhead(min){
  const sn=S.snap,st=S.settings,nowH=hoursNow(),M=S.model.m[cls(Date.now())],dh=min/60;
  if(!M.n&&sn.noData)return null;
  const tt=Math.min(nowH+dh,23.99),c=conf();
  let mid;
  if(sn.noData)mid=histAt(M,tt);
  else{
    const hd=M.n?histAt(M,tt)-histAt(M,nowH):0,w=!M.n?0:(M.n>=st.minDays?.7:.3),tau=1.5;
    mid=sn.pct+w*hd+(1-w)*sn.rate*tau*(1-Math.exp(-dh/tau));
  }
  mid=clamp(mid,0,1);
  const band=clamp(.03+.035*dh+.5*histAt(M,tt,'sd'),.03,.2)*(c===0?1.5:1);
  return{v:mid,lo:clamp(mid-band,0,1),hi:clamp(mid+band,0,1),kind:'pred'};
}
function obsAt(h){
  const sn=S.snap,nowH=hoursNow(),pts=[];
  for(let i=0;i<=Math.floor(nowH)&&i<24;i++)if(sn.hourObs[i]!=null)pts.push([i,sn.hourObs[i]]);
  pts.push([nowH,sn.pct]);
  if(h<=pts[0][0])return pts[0][1];
  for(let i=1;i<pts.length;i++)if(h<=pts[i][0]){const[a,va]=pts[i-1],[b,vb]=pts[i];return b===a?vb:va+(vb-va)*(h-a)/(b-a)}
  return pts[pts.length-1][1];
}
function valueAt(off,h){
  const sn=S.snap,nowH=hoursNow();
  if(off===0){
    if(h<=nowH+1e-6){if(sn.noData)return null;const v=obsAt(h);return{v,lo:v,hi:v,kind:'obs'}}
    return predictAhead((h-nowH)*60);
  }
  const dt=Date.now()+off*DAY,M=S.model.m[cls(dt)];
  if(!M.n)return null;
  const v=histAt(M,h),b=Math.max(.04,histAt(M,h,'sd')*.8)*(M.n<S.settings.minDays?1.4:1);
  return{v,lo:clamp(v-b,0,1),hi:clamp(v+b,0,1),kind:'pred'};
}
function confFor(off){
  if(off===0)return conf();
  const n=S.model.m[cls(Date.now()+off*DAY)].n,st=S.settings;
  let c=n>=st.minDays?2:n>=Math.ceil(st.minDays/2)?1:0;
  if(S.snap.mode==='DEMO'&&c>1)c=1;return c;
}
function windows(off,durH,from,to,minStart){
  const out=[];let s=Math.max(from,minStart==null?from:minStart);s=Math.ceil(s*2-1e-9)/2;
  for(;s+durH<=to+1e-9;s+=.5){
    const p=[];for(let t=s;t<=s+durH+1e-9;t+=.25){const v=valueAt(off,t);if(v&&v.v!=null)p.push(v)}
    if(!p.length)continue;
    const mean=avg(p.map(x=>x.v));
    out.push({s,e:s+durH,mean,lo:avg(p.map(x=>x.lo)),hi:avg(p.map(x=>x.hi)),mx:Math.max(...p.map(x=>x.v)),lvl:level(mean),off});
  }

}
function greedy(c,n){
  const pool=c.slice().sort((a,b)=>a.mean-b.mean),out=[];
  for(const w of pool){if(out.every(o=>w.e<=o.s||w.s>=o.e))out.push(w);if(out.length>=n)break}
  return out;
}
function runPlan(p){
  const st=S.settings,dur=p.dur/60,from=Math.max(st.open,p.from),to=Math.min(st.close,p.to);
  const cand=windows(p.off,dur,from,to,p.off===0?hoursNow():null);
  const dm=[];for(let h=from;h<=to;h++){const v=valueAt(p.off,h);if(v&&v.v!=null)dm.push(v.v)}
  const dayMean=avg(dm);
  let pool=cand;
  if(p.crowd==='Low')pool=cand.filter(w=>w.lvl===0);else if(p.crowd==='Moderate')pool=cand.filter(w=>w.lvl<=1);
  let picks=greedy(pool,3),alt=false,msg='',comp='';
  if(!cand.length){msg=(S.snap.noData&&!S.model.days.length)?'There is no data yet. The admin needs to add the library spreadsheet first.':p.off===0?'No time is left today inside your window and the library hours. Try another date or widen the window.':'No windows fit that duration inside your time range. Try a shorter session or a wider range.';return{p,picks:[],alt:true,msg,comp,dayMean}}
  if(!picks.length){
    alt=true;picks=greedy(cand,3);
    msg=p.crowd==='Low'?'No window stays Low for the whole session on that day. These are the closest options.':'Nothing matched your crowd preference. These are the best available options.';
    if(p.crowd==='Low'){
      for(const d of [2,1,.5].filter(x=>x<dur)){
        const c2=windows(p.off,d,from,to,p.off===0?hoursNow():null).filter(w=>w.lvl===0);
        if(c2.length){const b=greedy(c2,1)[0];comp=`Compromise: a ${fmtDur(d)} session at ${fmtR(b.s,b.e)} stays Low. Or accept Moderate for the full ${fmtDur(dur)}.`;break}
      }
      if(!comp)comp='Compromise: accept Moderate, or pick another date.';
    }else comp='Compromise: shift the time range or shorten the session.';
  }
  return{p,picks,alt,msg,comp,dayMean};
}
function reasonFor(w,dayMean,off){
  const d=Math.round((dayMean-w.mean)*100);
  if(d>=4)return off>0?'Historical occupancy is generally lower during this window.':'Forecast shows lower occupancy than the rest of the day.';
  if(d<=-4)return 'Busier than the rest of the day, but the best fit for this duration.';

}
function nowState(){const h=hoursNow(),st=S.settings;return h>=st.close||h<st.open?'closed':'open'}
function altWindow(curPct){
  const st=S.settings,nowH=hoursNow();
  if(nowH<st.close){
    const c=windows(0,1,Math.max(st.open,nowH),st.close,nowH+.5).filter(w=>w.mean<curPct-.06||w.lvl===0);
    const b=greedy(c,1)[0];
    if(b)return{label:'Today '+fmtR(b.s,b.e),mean:b.mean,w:b};
  }
  const c=windows(1,1,st.open,st.close);
  const b=greedy(c,1)[0];
  return b?{label:'Tomorrow '+fmtR(b.s,b.e),mean:b.mean,w:b}:null;
}
function goNow(){
  const sn=S.snap,st=S.settings,c=conf(),demo=sn.mode==='DEMO';
  if(sn.noData)return{nodata:true};
  if(nowState()==='closed'){
    const a=altWindow(1);
    return{closed:true,alt:a,demo,c};
  }
  const p30=predictAhead(30),p60=predictAhead(60),cur=sn.pct;
  const mx=Math.max(cur,p30?p30.v:0,p60?p60.v:0),lv=level(mx),tone=lv===0?0:lv===1?1:2;
  const alt=tone>0?altWindow(cur):null;
  const trend=sn.trend==='Increasing'?'rising':sn.trend==='Decreasing'?'falling':'steady';
  let txt=`Occupancy is ${pc(cur)}% and ${trend}`+(p30?`; predicted ${pc(p30.v)}% in 30 min`:'')+(p60?` and ${pc(p60.v)}% in 60 min`:'')+'.';
  if(alt)txt+=` Consider visiting ${alt.label.replace(/^(Today|Tomorrow) /,m=>m.toLowerCase())} when the forecast shows about ${pc(alt.mean)}%.`;
  const prefix=demo?'Simulated: ':c===0?'Based on limited data: ':'';
  return{tone,cur,p30,p60,alt,txt:prefix+txt,demo,c,people:sn.occ};
}
function dayList(){
  const sn=S.snap,cap=S.settings.capacity,T=sn.T,out=[];
  if(T)out.push({key:T.key,date:T.date,occ:T.hourOcc.map(v=>v==null?null:v/cap),entries:T.entries,exits:T.exits,sim:T.sim,live:T.live,today:true});

const srcLabel=d=>d.sim&&d.live?'MIXED':d.sim?'SIMULATED':d.live?'LIVE':'—';
function crossing(occ,thr){for(let h=0;h<23;h++){if(occ[h]!=null&&occ[h+1]!=null&&occ[h]<thr&&occ[h+1]>=thr)return h+(thr-occ[h])/(occ[h+1]-occ[h])}return null}
function advisories(){
  const st=S.settings,days=S.model.days,out=[],thr=.85;
  const cr=days.map(d=>crossing(d.occ,thr)).filter(x=>x!=null);
  if(cr.length>=2){
    const h=avg(cr),hh=Math.floor(h),mm=Math.round((h-hh)*60);
    const t=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
    out.push({id:'adv-85',admin:`Occupancy has exceeded 85% at ${t} on ${cr.length} of the last ${days.length} days. Consider displaying a crowd advisory at the entrance during ${fmtH(hh)}–${fmtH(hh+1)}.`,
      student:`The library often passes 85% around ${fmtH(h)}. Come earlier or later for an easier seat.`});
  }
  const M=S.model.m.wd;
  if(M.n){
    let pk=st.open,qh=st.open+1;
    for(let h=st.open;h<=st.close;h++)if(M.mean[h]>M.mean[pk])pk=h;
    for(let h=st.open+1;h<=st.close-1;h++)if(M.mean[h]<M.mean[qh])qh=h;
    const part=pk<12?'morning':pk<15?'early afternoon':pk<18?'late afternoon':'evening';
    out.push({id:'adv-peak',admin:`Historical data indicates a recurring peak during ${part} on weekdays (around ${fmtH(pk)}, about ${pc(M.mean[pk])}% on average).`,
      student:`Weekday crowds usually peak around ${fmtH(pk)}. The quietest hour after opening is ${fmtH(qh)}.`});

  if(o.pred&&o.pred.length>1){
    const up=o.pred.map((p,i)=>(i?'L':'M')+X(p.h).toFixed(1)+' '+Y(p.hi).toFixed(1)).join(' ');
    const dn=o.pred.slice().reverse().map(p=>'L'+X(p.h).toFixed(1)+' '+Y(p.lo).toFixed(1)).join(' ');
    s+=`<path class="band" d="${up} ${dn} Z"/><path class="prd" d="${path(o.pred)}"/>`;
  }
  if(o.obs&&o.obs.length>1){
    const a=o.obs;s+=`<path class="obs-a" d="${path(a)} L${X(a[a.length-1].h)} ${Y(0)} L${X(a[0].h)} ${Y(0)} Z"/><path class="obs" d="${path(a)}"/>`;
  }
  if(o.nowH!=null&&o.nowH>=o0&&o.nowH<=c0)s+=`<line class="now" x1="${X(o.nowH)}" x2="${X(o.nowH)}" y1="${T}" y2="${Y(0)}"/><text class="tx" x="${X(o.nowH)+4}" y="${T+8}" style="fill:var(--mod)">Now</text>`;
  if(o.sel!=null){const v=o.selV;s+=`<line class="sel" x1="${X(o.sel)}" x2="${X(o.sel)}" y1="${T}" y2="${Y(0)}"/>`;if(v!=null)s+=`<circle cx="${X(o.sel)}" cy="${Y(v)}" r="4.5" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>`}
  if(o.hits){const step=(W-L-R)/(c0-o0);for(let h=o0;h<=c0;h++)s+=`<rect class="hit" data-a="fc-hour" data-h="${h}" x="${X(h)-step/2}" y="${T}" width="${step}" height="${H-T-B}"/>`}
  return s+'</svg>';
}
function todaySeries(){
  const sn=S.snap,st=S.settings,nowH=hoursNow(),obs=[],pred=[];
  if(!sn.noData){
    for(let h=st.open;h<=Math.min(Math.floor(nowH),st.close);h++){const v=valueAt(0,h);if(v&&v.v!=null)obs.push({h,v:v.v})}
    if(nowH>=st.open&&nowH<=st.close)obs.push({h:nowH,v:sn.pct});
  }
  if(nowH<=st.close){
    if(!sn.noData&&nowH>=st.open&&nowH<=st.close)pred.push({h:nowH,v:sn.pct,lo:sn.pct,hi:sn.pct});
    for(let h=Math.max(st.open,Math.ceil(nowH+1e-6));h<=st.close;h++){const v=predictAhead((h-nowH)*60);if(v)pred.push({h,v:v.v,lo:v.lo,hi:v.hi})}
  }
  const M=S.model.m[cls(Date.now())],ghost=M.n?Array.from({length:st.close-st.open+1},(_,i)=>({h:st.open+i,v:M.mean[st.open+i]})):[];
  return{obs,pred,ghost,nowH};
}
function next24(){
  const st=S.settings,nowH=hoursNow(),out=[];
  for(let h=Math.max(Math.ceil(nowH),st.open);h<=st.close;h++){const v=valueAt(0,h);if(v&&v.v!=null)out.push(Object.assign({h,off:0,day:'Today'},v))}
  for(let h=st.open;h<=Math.min(st.close,Math.floor(nowH));h++){const v=valueAt(1,h);if(v&&v.v!=null)out.push(Object.assign({h,off:1,day:'Tomorrow'},v))}
  return out;
}
function bestToday(dur){
  const st=S.settings,nowH=hoursNow();
  let c=nowH<st.close?windows(0,dur,Math.max(st.open,nowH),st.close,nowH):[];
  let b=greedy(c,1)[0];
  if(!b){c=windows(1,dur,st.open,st.close);b=greedy(c,1)[0]}
  return b;
}
const winLabel=w=>(w.off===1?'Tomorrow ':'Today ')+fmtR(w.s,w.e);

/* ---------- Forecast ---------- */
function hourDetail(h){
  const sn=S.snap,st=S.settings,nowH=hoursNow(),demo=sn.mode==='DEMO',c=conf();
  const v=valueAt(0,h);
  if(!v||v.v==null)return '<p class="mute">Prediction unavailable.</p>';
  const lv=level(v.v);let counts='';
  if(v.kind==='obs'&&sn.T){
    counts=`Actual entries ${sn.T.hEn[h]} · exits ${sn.T.hEx[h]}${h===Math.floor(nowH)?' so far this hour':''}`;
  }else{
    const nx=valueAt(0,h+1),net=nx?Math.round((nx.v-v.v)*sn.cap):0,turn=Math.round(v.v*sn.cap*.28);
    const en=Math.max(0,net)+turn,ex=Math.max(0,-net)+turn;
    counts=`Expected entries ≈ ${en} · exits ≈ ${ex} · net ${net>=0?'+':''}${net}`;
  }
  const note=v.kind==='obs'?'Observed from processed scans.':c===0?'Low confidence: little matching history or recent data.':c===1?'Medium confidence: based on simulated or limited history.':'High confidence: matching weekdays and recent scans agree.';
  return `<div class="row between"><b style="font-size:16px">${fmtH(h)}</b><span>${kindTag(v.kind,demo)}</span></div>
    <div class="row" style="margin-top:8px"><span class="tv">${v.kind==='obs'?pc(v.v)+'%':rangeTxt(v.lo,v.hi)}</span>${pill(lv)}</div>
    <p class="mute" style="font-size:13px;margin-top:6px">${esc(counts)}</p><p class="mute" style="font-size:13px">${esc(note)}</p>`;
}

function barsHTML(items){
  return `<div class="bars">${items.map(i=>`<div class="l${i.lv}" title="${esc(i.title)}"><b style="height:${Math.max(2,i.v*100)}%;${i.dim?'opacity:.45':''}"></b><span>${esc(i.lab)}</span></div>`).join('')}</div>`;
}
function openHrsAvg(d){const st=S.settings,a=d.occ.slice(st.open,st.close+1).filter(v=>v!=null);return a.length?avg(a):null}
function peakLow(d){
  const st=S.settings;let pk=null,lo=null;
  for(let h=st.open;h<=st.close;h++){const v=d.occ[h];if(v==null)continue;if(!pk||v>pk.v)pk={h,v};if(h>st.open&&h<st.close&&(!lo||v<lo.v))lo={h,v}}
  return{pk,lo};
}
function histAlerts(){
  const out=[],st=S.settings;
  S.model.days.forEach(d=>{
    const hi=crossing(d.occ,st.modMax/100);
    if(hi!=null)out.push({ts:d.date+hi*HR,lv:2,txt:`Crossed High (${st.modMax}%)`,src:srcLabel(d)});
    const nr=crossing(d.occ,st.highMax/100);
    if(nr!=null)out.push({ts:d.date+nr*HR,lv:3,txt:`Crossed Near Capacity (${st.highMax}%)`,src:srcLabel(d)});
  });
  return out;
}

/* spreadsheet parsing */
function parseRows(rows){
  const ok=[],bad=[];
  rows=rows.filter(r=>r&&r.some(c=>String(c).trim()!==''));
  if(!rows.length)return{ok,bad:[{row:0,reason:'File is empty'}]};
  const hdr=rows[0].map(c=>String(c).toLowerCase());let ci=-1,ti=-1,yi=-1;
  hdr.forEach((c,i)=>{if(ci<0&&/id|token|tag|card|anon/.test(c))ci=i;else if(ti<0&&/time|date|stamp/.test(c))ti=i;else if(yi<0&&/type|event|dir|status/.test(c))yi=i});
  const typeOf=v=>{v=String(v).trim().toLowerCase();return/^(in|entry|enter)/.test(v)?'ENTRY':/^(out|exit|leave)/.test(v)?'EXIT':null};
  let start=1;
  if(ci<0||ti<0||yi<0){ci=0;ti=1;yi=2;start=typeOf(rows[0][2])?0:1}
  for(let i=start;i<rows.length;i++){
    const r=rows[i],id=String(r[ci]==null?'':r[ci]).trim(),ty=typeOf(r[yi]);let ts=NaN,v=r[ti];
    if(typeof v==='number'&&v>20000&&v<80000)ts=Math.round((v-25569)*864e5)+new Date().getTimezoneOffset()*6e4;
    else if(v instanceof Date)ts=v.getTime();
    else ts=Date.parse(String(v).trim().replace(' ','T'));
    if(!id)bad.push({row:i+1,reason:'Missing ID'});
    else if(isNaN(ts))bad.push({row:i+1,reason:'Unreadable timestamp'});
    else if(!ty)bad.push({row:i+1,reason:'Type must be ENTRY or EXIT'});
    else ok.push({token:'u_'+hash(id),ts,type:ty});
  }
  return{ok,bad};
}
function csvRows(t){return t.split(/\r?\n/).map(l=>l.split(/[,\t;]/).map(c=>c.trim()))}
function sampleRows(){
  const b=new Date();b.setHours(9,30,0,0);const rows=[['anonymized_id','timestamp','event_type']];
  for(let i=0;i<30;i++){const t=new Date(b.getTime()+i*20000).toISOString().slice(0,19);rows.push(['S'+String(100+i%18),t,i%3===2?'EXIT':'ENTRY'])}
  rows.push(['S100',new Date(b.getTime()+5000).toISOString().slice(0,19),'ENTRY']);
  rows.push(['S900','not a time','ENTRY']);
  return rows;
}

/* ---------- live scans: one bar per second for the last minute, plus a running log ---------- */
function liveHTML(){
  const now=Date.now(),sn=S.snap,N=60,en=Array(N).fill(0),ex=Array(N).fill(0);
  for(const e of S.events){const a=now-e.ts;if(a<0||a>=N*1000||e._dup)continue;(e.type==='ENTRY'?en:ex)[N-1-Math.floor(a/1000)]++}
  const sE=en.reduce((a,b)=>a+b,0),sX=ex.reduce((a,b)=>a+b,0),mx=Math.max(3,...en,...ex);
  const W=S.ui.cw||340,H=140,mid=H/2,bw=(W-8)/N,half=mid-14;
  let bars='';
  for(let i=0;i<N;i++){
    const x=(4+i*bw+1).toFixed(1),w=Math.max(1,bw-2).toFixed(1);
    if(en[i]){const h=en[i]/mx*half;bars+=`<rect x="${x}" y="${(mid-h).toFixed(1)}" width="${w}" height="${h.toFixed(1)}" rx="1" fill="var(--fg)"/>`}
    if(ex[i]){const h=ex[i]/mx*half;bars+=`<rect x="${x}" y="${mid}" width="${w}" height="${h.toFixed(1)}" rx="1" fill="var(--accent)"/>`}
  }
  const svg=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entries and exits in each of the last 60 seconds. ${sE} in, ${sX} out."><line class="ax" x1="4" x2="${W-4}" y1="${mid}" y2="${mid}"/>${bars}<text class="tx" x="6" y="12">In</text><text class="tx" x="6" y="${mid+14}">Out</text><text class="tx" x="6" y="${H-4}">60 s ago</text><text class="tx" x="${W-6}" y="${H-4}" text-anchor="end">now</text></svg>`;
  const rows=S.events.filter(e=>e.ts<=now).sort((a,b)=>b.ts-a.ts).slice(0,25).map(e=>`<tr><td class="mono">${fmtTime(e.ts)}</td><td>${e.type==='ENTRY'?'<span class="tag">IN</span>':'<span class="tag pred">OUT</span>'}</td><td class="mono">${esc(String(e.token).slice(0,10))}</td><td>${e._dup?'Double scan':'OK'}</td></tr>`).join('');
  const tile=(l,v)=>`<div class="tile" style="cursor:default"><span class="tl">${l}</span><span class="tv">${v}</span></div>`;
  return `<div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-bottom:12px">${tile('Inside now',sn.noData?'—':sn.occ.toLocaleString('en-IN')+' · '+(sn.pct*100).toFixed(1)+'%')}${tile('In, last 60 s',sE)}${tile('Out, last 60 s',sX)}${tile('Net, last 60 s',(sE-sX>0?'+':'')+(sE-sX))}</div>${svg}
  <div class="tw" style="margin-top:12px"><table><thead><tr><th>Time</th><th>In or out</th><th>ID</th><th>Check</th></tr></thead><tbody>${rows||'<tr><td colspan="4">No scans yet</td></tr>'}</tbody></table></div>`;
}

  'fc-view':t=>{S.ui.fcView=t.dataset.v;render()},'fc-dur':t=>{S.ui.fcDur=+t.dataset.d;render()},
  'ins-cls':t=>{S.ui.insCls=t.dataset.v;render()},
  'plan-open':()=>{S.ui.planForm=S.ui.planForm||planDefaults();openSheet('plan-form')},
  'pf-dur':t=>{syncPlanForm().dur=+t.dataset.v;renderSheet(true)},
  'pf-crowd':t=>{syncPlanForm().crowd=t.dataset.v;renderSheet(true)},
  'plan-accept':t=>{
    const i=+t.dataset.i,w=S.ui.plan.picks[i],r=S.ui.plan,v=store.get(visitsKey(),[]);
    v.push({id:'v'+Date.now()+i,label:fmtDate(r.dateMs)+' · '+fmtR(w.s,w.e),range:rangeTxt(w.lo,w.hi),lvl:LV[w.lvl],sim:S.snap.mode==='DEMO'});
    store.set(visitsKey(),v);S.ui.accepted[i]=true;toast('Saved to your Profile.');render();
  },
  'plan-close':t=>{S.ui.plan.picks.splice(+t.dataset.i,1);S.ui.accepted={};render()},
  'visit-del':t=>{store.set(visitsKey(),store.get(visitsKey(),[]).filter(v=>v.id!==t.dataset.id));render()},
  'admin-open':t=>{if(!isAdmin())return;S.view='admin';S.ui.tab=t.dataset.t||'overview';render()},
  'admin-tab':t=>{S.ui.tab=t.dataset.t;render()},
  range:t=>{S.ui.range=+t.dataset.v;render()},
  ack:t=>{const a=store.get('lp_acked',[]);a.push(t.dataset.id);store.set('lp_acked',a);toast('Insight archived.');render()},
  'settings-reset':()=>{S.settings=Object.assign({},DEF);store.set('lp_settings',S.settings);S.hist=buildHist();toast('Defaults restored.');update()},
  'sim-entry':()=>{addSim('ENTRY');update();toast('Simulated entry added.')},
  'sim-exit':()=>{addSim('EXIT');update();toast('Simulated exit added.')},
  'sim-surge':()=>surge(S.ui.surgeN),auto:toggleAuto,
  seed:()=>{S.events=S.events.filter(e=>e.src==='LIVE').concat(seedToday());update();toast('Demo day replayed.')},
  reset:()=>{S.events=S.events.filter(e=>e.src==='LIVE');update();toast(S.events.length?'Demo reset to last live snapshot.':'Demo reset. No live data yet.')},
  pause:()=>{S.paused=!S.paused;update();toast(S.paused?'Live ingestion paused.':'Live ingestion resumed.')},
  'up-mark':t=>{S.ui.upload.mark=t.dataset.v;render()},
  'up-cancel':()=>{S.ui.upload=null;render()},
  'up-sample':()=>{S.ui.upload=Object.assign({name:'Sample rows',mark:'SIMULATED',replace:false,shift:false},parseRows(sampleRows()));render()},
  'up-paste':()=>{const v=($('#uptext')||{}).value||'';if(!v.trim()){$('#up-err').textContent='Paste some rows first.';return}S.ui.upload=Object.assign({name:'Pasted rows',mark:'LIVE',replace:true,shift:false},parseRows(csvRows(v)));render()},
  'up-replace':t=>{S.ui.upload.replace=t.dataset.v==='1';render()},
  'up-shift':t=>{S.ui.upload.shift=t.dataset.v==='1';render()},
  'up-confirm':()=>{
    const u=S.ui.upload;
    if(S.paused&&u.mark==='LIVE'){toast('Live ingestion is paused. Resume it first.');return}
    let shift=0;
    if(u.shift&&u.ok.length){let mx=-Infinity;for(const r of u.ok)if(r.ts>mx)mx=r.ts;shift=dayStart(Date.now())-dayStart(mx)}
    if(u.replace){S.events=S.events.filter(e=>e.origin==='upload');S.noHist=true;S.hist=[];store.set('lp_nohist',true);store.set('lp_nodemo',true)}
    u.ok.forEach(r=>S.events.push(mkEvent(r.type,u.mark,'upload',r.ts+shift,r.token)));
    const kept=store.set('lp_uploaded',S.events.filter(e=>e.origin==='upload').map(e=>[e.ts,e.token,e.type,e.src]));
    toast(`Done. ${u.ok.length} rows loaded.`+(kept?'':' The file is too big to keep after you refresh.'));
    stopFeed(true);S.ui.upload=null;S.ui.selDay=null;update();
  },
  'up-clear':()=>{store.set('lp_uploaded',[]);S.events=[];toast('Your spreadsheet was removed.');update()},
  export:()=>{
    S.ui.exDs=$('#ex-ds').value;S.ui.exFmt=$('#ex-fmt').value;
    S.ui.exportText=buildExport(S.ui.exDs,S.ui.exFmt,S.ui.range===1?7:S.ui.range);render();
  },
  copy:()=>{
    const ta=$('#ex-out');
    const fb=()=>{ta.focus();ta.select();toast('Press Ctrl+C or long-press to copy.')};
    try{navigator.clipboard.writeText(S.ui.exportText).then(()=>toast('Copied.'),fb)}catch(e){fb()}
  },
  grant:t=>{const us=getUsers().map(u=>u.email===t.dataset.e?Object.assign({},u,{role:'admin'}):u);saveUsers(us);toast('Admin role granted.');render()},
  retry:()=>{S.ui.errOff=false;update()},'dismiss-err':()=>{S.ui.errOff=true;render()},
  logout:()=>{stopFeed(true);S.user=null;store.set('lp_session',null);S.ui.sheet=null;S.ui.auth='login';S.ui.authErr='';renderAuth()},
  'auth-role':t=>{S.ui.role=t.dataset.v;S.ui.auth='login';S.ui.authErr='';renderAuth()},
  'auth-tab':t=>{S.ui.auth=t.dataset.v;S.ui.resetStep=0;S.ui.authErr='';renderAuth()},
  quick:t=>{const e=t.dataset.r==='admin'?'admin@vit.ac.in':'student@vit.ac.in';login(getUsers().find(u=>u.email===e))}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t||!A[t.dataset.a])return;
  if(ADMIN_ONLY.has(t.dataset.a)&&!isAdmin())return;
  if(t.dataset.confirm&&!t.dataset.armed){
    t.dataset.armed='1';t._txt=t.textContent;t.textContent='Tap again to confirm';
    setTimeout(()=>{if(t.isConnected&&t.dataset.armed){delete t.dataset.armed;t.textContent=t._txt}},3500);return;
  }
  A[t.dataset.a](t,e);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.ui.sheet){S.ui.sheet=null;renderSheet()}});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='dayPick'){S.ui.selDay=e.target.value;render()}
  else if(id==='surgeN')S.ui.surgeN=+e.target.value;
  else if(id==='ex-ds')S.ui.exDs=e.target.value;else if(id==='ex-fmt')S.ui.exFmt=e.target.value;
  else if(id==='upfile'&&e.target.files[0]&&isAdmin()){
    const f=e.target.files[0],err=$('#up-err');
    const done=rows=>{const r=parseRows(rows);let mx=-Infinity;for(const x of r.ok)if(x.ts>mx)mx=x.ts;S.ui.upload=Object.assign({name:f.name,mark:'LIVE',replace:true,shift:r.ok.length>0&&dayStart(mx)!==dayStart(Date.now())},r);render()};
    f.arrayBuffer().then(buf=>{
      if(typeof XLSX!=='undefined'){try{const wb=XLSX.read(buf,{type:'array'});done(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}));return}catch(x){err.textContent='Could not read that file.';return}}
      if(/\.csv$/i.test(f.name))done(csvRows(new TextDecoder().decode(buf)));
      else err.textContent='This file type could not be read. Please save it as CSV and try again.';
    }).catch(()=>{err.textContent='Could not read that file.'});
  }
});
document.addEventListener('submit',e=>{
  const f=e.target.dataset.form;if(!f)return;e.preventDefault();
  const v=id=>(document.getElementById(id)||{}).value||'';
  const fail=m=>{S.ui.authErr=m;renderAuth()};
  if(f==='login'){
    const u=getUsers().find(x=>x.email===v('a-email').trim().toLowerCase());
    if(!u||u.ph!==hash('lp'+v('a-pw')))return fail('Email or password is incorrect.');
    if(u.role!==(S.ui.role||'student'))return fail(u.role==='admin'?'This is an admin account. Use the Admin section.':'This is a student account. Use the Student section.');
    S.ui.authErr='';login(u);
  }else if(f==='signup'){
    const em=v('a-email').trim().toLowerCase(),nm=v('a-name').trim();
    if(!nm)return fail('Enter your full name.');
    if(getUsers().some(x=>x.email===em))return fail('An account with that email already exists. Log in instead.');
    const u={name:nm,email:em,role:'student',ph:hash('lp'+v('a-pw'))};
    saveUsers(getUsers().concat(u));S.ui.authErr='';login(u);
  }else if(f==='reset1'){
    const em=v('a-email').trim().toLowerCase();
    if(!getUsers().some(x=>x.email===em))return fail('No account found for that email.');
    S.ui.resetEmail=em;S.ui.resetStep=1;S.ui.authErr='';renderAuth();
  }else if(f==='reset2'){
    saveUsers(getUsers().map(x=>x.email===S.ui.resetEmail?Object.assign({},x,{ph:hash('lp'+v('a-pw'))}):x));
    S.ui.auth='login';S.ui.resetStep=0;S.ui.authErr='';renderAuth();toast('Password updated. Log in with your new password.');
  }else if(f==='plan')submitPlan();
  else if(f==='contact'){
    const k='lp_msgs_'+S.user.email,m=store.get(k,[]);m.push({text:v('c-msg').trim(),ts:Date.now()});store.set(k,m);toast('Message sent to the library.');render();
  }else if(f==='settings'){if(!isAdmin())return;
    const n=id=>parseFloat(v(id)),err=$('#s-err');
    const c={capacity:n('s-cap'),dedupeSec:n('s-dd'),lowMax:n('s-low'),modMax:n('s-mod'),highMax:n('s-high'),trendPct:n('s-trend'),minDays:n('s-days'),minEvents:n('s-ev')};
    if(Object.values(c).some(x=>isNaN(x)||x<0))return err.textContent='Enter valid numbers in every field.';
    if(c.capacity<1)return err.textContent='Capacity must be at least 1.';
    if(!(c.lowMax<c.modMax&&c.modMax<c.highMax&&c.highMax<100))return err.textContent='Boundaries must increase: Low < Moderate < High < 100.';
    S.settings=Object.assign({},S.settings,c);store.set('lp_settings',S.settings);S.hist=buildHist();
    toast('Settings saved. Student recommendations updated.');update();
  }
});
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.user)render()},200)});

/* ---------- boot ---------- */
(function boot(){
  const old={'admin@vit.ac.in':'admin123','student@vit.ac.in':'student123'};
  let us=getUsers().filter(u=>!(old[u.email]&&u.ph===hash('lp'+old[u.email])));
  [{name:'Library Admin',email:'admin@vit.ac.in',role:'admin',pw:'Admin@123'},{name:'Student User',email:'student@vit.ac.in',role:'student',pw:'Student@123'}]
    .forEach(b=>{if(!us.some(u=>u.email===b.email))us.push({name:b.name,email:b.email,role:b.role,ph:hash('lp'+b.pw)})});
  saveUsers(us);
  store.set('lp_uploaded',[]);store.set('lp_nohist',false);store.set('lp_nodemo',false);
  S.noHist=false;S.hist=buildHist();S.events=seedToday();
  recompute();
  const em=store.get('lp_session',null);
  if(em){const u=getUsers().find(x=>x.email===em);if(u)S.user=u}
  render();ensureFeed();
  setInterval(()=>{if(S.user)update(true)},60000);
  setInterval(liveTick,1000);
  window.__LP={listeners:window.__L||[],S,VIEWS,sheetContent,A,feedTick,liveTick,patchHome,render,navItems,parseRows,sampleRows,mkEvent,recompute,getUsers};
})();
</script>
